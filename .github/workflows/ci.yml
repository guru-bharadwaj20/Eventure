name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sporture/Server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Sporture/Server/package-lock.json

      - run: npm ci

      # Covers source, scripts and tests — tsconfig.build.json narrows to
      # source only for the emit step.
      - run: npm run typecheck

      - run: npm run build

      # mongodb-memory-server downloads a mongod binary on first use; caching it
      # keeps subsequent runs from re-fetching ~70MB.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: npm test

  client:
    name: Client (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sporture/Client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Sporture/Client/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
