# Full local stack: database, API, web. No Atlas account, no manual setup.
#
#   docker compose up --build          start everything
#   docker compose --profile seed up seed   load demo data (once)
#   docker compose down -v             stop and delete the database
#
# The app is then on http://localhost:8080.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Not published to the host by default — nothing outside the compose
    # network needs it, and binding 27017 would collide with a local install.
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./Sporture/Server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/sporture
      # Dev-only placeholder. It satisfies the 32-character minimum the server
      # enforces at boot; a real deployment must supply its own.
      JWT_SECRET: ${JWT_SECRET:-docker-compose-development-secret-not-for-production-use}
      JWT_EXPIRES_IN: 1d
      # Requests reach the API through the nginx proxy, so the browser's origin
      # is the web container's.
      CLIENT_ORIGINS: http://localhost:8080
      BACKEND_URL: http://localhost:8080
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5000"

  web:
    build:
      # Context is Sporture/ rather than Sporture/Client because the client
      # imports the API contract from ../shared.
      context: ./Sporture
      dockerfile: Client/Dockerfile
      args:
        # Empty: the client calls /api on its own origin, which nginx proxies.
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  # One-shot demo data loader. Behind a profile so `docker compose up` doesn't
  # silently rewrite the database on every start.
  seed:
    profiles: ["seed"]
    build:
      context: ./Sporture/Server
      target: build # the build stage still has devDependencies, and so tsx
    environment:
      MONGO_URI: mongodb://mongo:27017/sporture
      JWT_SECRET: ${JWT_SECRET:-docker-compose-development-secret-not-for-production-use}
      SEED_PASSWORD: ${SEED_PASSWORD:-Password123!}
    depends_on:
      mongo:
        condition: service_healthy
    command: ["npm", "run", "seed"]

volumes:
  mongo-data:
  uploads:
