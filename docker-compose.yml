name: sporture

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./Server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/sporture
      JWT_SECRET: ${JWT_SECRET:-docker-compose-development-secret-not-for-production-use}
      JWT_EXPIRES_IN: 1d
      CLIENT_ORIGINS: http://localhost:8080
      BACKEND_URL: http://localhost:8080
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5000"

  web:
    build:
      context: .
      dockerfile: Client/Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  seed:
    profiles: ["seed"]
    build:
      context: ./Server
      target: build
    environment:
      MONGO_URI: mongodb://mongo:27017/sporture
      JWT_SECRET: ${JWT_SECRET:-docker-compose-development-secret-not-for-production-use}
      SEED_PASSWORD: ${SEED_PASSWORD:-Password123!}
    depends_on:
      mongo:
        condition: service_healthy
    command: ["npm", "run", "seed"]

volumes:
  mongo-data:
  uploads:
