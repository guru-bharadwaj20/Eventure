server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is proxied under the same origin as the app. That keeps CORS out
    # of the picture entirely for the Docker setup, and means the client can be
    # built with an empty VITE_API_URL.
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded avatars are served by the API, not from the static bundle.
    location /uploads/ {
        proxy_pass http://api:5000/uploads/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://api:5000/health;
        proxy_set_header Host $host;
    }

    # Hashed assets are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths are React Router's problem, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
